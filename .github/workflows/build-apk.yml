name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Mettre l'application dans l'APK (hors ligne)
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

      - name: Construire l'APK (debug)
        run: gradle assembleDebug --no-daemon

      - name: Publier l'APK comme résultat
        uses: actions/upload-artifact@v4
        with:
          name: cash-point-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK sur un lien direct (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CashPoint.apk
          gh release create "v${{ github.run_number }}" CashPoint.apk --repo "${{ github.repository }}" --title "Cash Point - version ${{ github.run_number }}" --notes "Installer CashPoint.apk par-dessus l'ancienne version (ne pas désinstaller)." --latest
