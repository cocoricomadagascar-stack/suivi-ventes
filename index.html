<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFC72C">
<title>Cash Point</title>
<style>
  :root{
    --jaune:#FFC72C; --noir:#1C1A17; --chaux:#FFFDF6; --gris:#6B665C; --ligne:#E8E0C8;
    --rouge:#E4002B; --orange:#FF7900; --vert:#0B8F3C; --bleu:#2E3192; --alerte:#B3261E;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    background:var(--jaune); color:var(--noir); font-size:16px; line-height:1.4;
    padding-bottom:env(safe-area-inset-bottom,0px); -webkit-tap-highlight-color:transparent;
  }
  body.bloque{overflow:hidden}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--bleu);outline-offset:2px}
  [hidden]{display:none!important}

  .enseigne{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0;max-width:620px;margin:0 auto}
  .enseigne-ligne{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .logo{font-family:'Arial Black','Arial Bold',Impact,sans-serif;font-weight:900;font-size:1.9rem;line-height:1;margin:0;letter-spacing:.01em}
  .qui{font-size:.9rem;font-weight:600;margin:4px 0 0}
  .btn-bord{background:transparent;border:2px solid var(--noir);border-radius:6px;padding:6px 12px;font-weight:700;font-size:.85rem}
  .bande{display:grid;grid-template-columns:1.1fr 1fr .8fr 1fr;height:10px;margin:12px 0 0;border-radius:2px;overflow:hidden}
  .bande span:nth-child(1){background:var(--rouge)} .bande span:nth-child(2){background:var(--noir)}
  .bande span:nth-child(3){background:var(--bleu)} .bande span:nth-child(4){background:var(--vert)}
  main{max-width:620px;margin:0 auto;padding:14px 14px 40px}

  label{display:block;font-weight:600;font-size:.92rem;margin:12px 0 0}
  input,select{display:block;width:100%;min-height:50px;margin-top:6px;padding:10px 12px;border:2px solid #CFC6AC;border-radius:8px;background:#fff;font-size:1.1rem}
  input:focus,select:focus{border-color:var(--noir);outline:none}
  .aide{font-size:.85rem;color:var(--gris);margin:4px 0 0;font-weight:400}
  .principal{display:block;width:100%;min-height:54px;margin-top:18px;border:0;border-radius:8px;background:var(--noir);color:var(--jaune);font-weight:800;font-size:1.1rem}
  .secondaire{display:block;width:100%;min-height:48px;margin-top:10px;border:2px solid var(--noir);border-radius:8px;background:transparent;font-weight:700}
  .danger-btn{border-color:var(--alerte);color:var(--alerte)}
  .petit-btn{border:2px solid var(--noir);background:#fff;border-radius:6px;padding:7px 10px;font-weight:700;font-size:.85rem}
  .petit-btn.plein{background:var(--noir);color:var(--jaune)}
  .petit-btn.danger{border-color:var(--alerte);color:var(--alerte)}

  .soldes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tuile{border-radius:8px;padding:10px 12px;min-height:76px;display:flex;flex-direction:column;justify-content:space-between}
  .t-nom{font-size:.85rem;font-weight:700}
  .t-val{font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
  .t-val.neg{text-decoration:underline wavy}
  .t-especes{background:var(--chaux);border:2px solid var(--noir)}
  .t-mvola{background:var(--vert);color:#fff}
  .t-orange{background:var(--noir);color:var(--orange)}
  .t-airtel{background:var(--rouge);color:#fff}
  .tuile.petit{min-height:58px;padding:8px 10px} .tuile.petit .t-val{font-size:1rem}

  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .act{min-height:64px;border:0;border-radius:8px;background:var(--noir);color:var(--chaux);font-weight:800;font-size:1.05rem;text-align:left;padding:10px 14px;display:flex;flex-direction:column;justify-content:center}
  .act small{font-weight:500;font-size:.78rem;color:#CFC6AC;margin-top:2px}
  .act.large{grid-column:1 / -1}
  .act.cloture{background:transparent;color:var(--noir);border:2px solid var(--noir)}
  .act.cloture small{color:var(--gris)}

  .panneau{background:var(--chaux);border-radius:10px;padding:14px;margin-top:14px}
  .panneau h2{font-size:1.15rem;margin:0}
  .panneau-tete{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .panneau-tete span{font-size:.88rem;color:var(--gris)}
  .vide{color:var(--gris);margin:10px 0 2px}
  .op{display:grid;grid-template-columns:6px 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--ligne)}
  .op:first-of-type{border-top:0}
  .op-barre{border-radius:3px}
  .c-mvola{background:var(--vert)} .c-orange{background:var(--orange)} .c-airtel{background:var(--rouge)} .c-especes{background:var(--noir)} .c-ajust{background:var(--bleu)}
  .op-titre{font-weight:700}
  .op-detail{font-size:.85rem;color:var(--gris);word-break:break-word}
  .op-droite{text-align:right}
  .op-montant{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
  .op-heure{font-size:.8rem;color:var(--gris)}
  .op-actions{grid-column:2 / -1;display:flex;gap:8px;flex-wrap:wrap}
  .badge{display:inline-block;font-size:.75rem;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:4px;vertical-align:1px}
  .b-annulee{background:#F6D4D1;color:var(--alerte)}
  .b-ok{background:#D4EEDC;color:#0B5E2A}
  .op.annulee .op-titre,.op.annulee .op-montant{text-decoration:line-through;opacity:.6}
  .alerte{background:var(--chaux);border-left:6px solid var(--alerte);border-radius:6px;padding:10px 12px;margin:12px 0 0;font-weight:600;font-size:.92rem}
  .info{background:var(--chaux);border-left:6px solid var(--bleu);border-radius:6px;padding:10px 12px;margin:12px 0 0;font-size:.92rem}

  .onglets{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
  .onglet{flex:0 0 auto;border:2px solid var(--noir);background:transparent;border-radius:999px;padding:8px 14px;font-weight:700}
  .onglet[aria-selected="true"]{background:var(--noir);color:var(--jaune)}
  .chiffres{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 4px;font-size:.92rem}
  .chiffres b{font-size:1.05rem}
  .grand-chiffre{font-size:2rem;font-weight:900;font-variant-numeric:tabular-nums;margin:4px 0 0}
  .rangee-btn{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
  th,td{text-align:right;padding:6px;border-top:1px solid var(--ligne);font-size:.9rem;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  thead th{border-top:0;font-size:.8rem;color:var(--gris);font-weight:700}
  .neg-txt{color:var(--alerte);font-weight:800}
  .pos-txt{color:#7A4A00;font-weight:800}
  .defil{overflow-x:auto}
  .tarifs input{min-height:40px;font-size:.95rem;padding:6px 8px;min-width:90px;margin:0}
  .tarifs td{padding:4px}
  .carte-rapport{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--ligne);border-radius:8px;padding:10px 12px;margin-top:8px}
  .carte-rapport b{font-size:1rem}

  .voile{position:fixed;inset:0;background:rgba(28,26,23,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .feuille{background:var(--chaux);width:100%;max-width:620px;max-height:92vh;overflow-y:auto;border-radius:14px 14px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:monte .18s ease-out}
  @keyframes monte{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){.feuille{animation:none}}
  .feuille-tete{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .feuille h2{margin:0;font-size:1.35rem}
  .fermer{border:0;background:transparent;font-size:1.6rem;line-height:1;padding:4px 8px}
  .choix{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
  .choix.deux{grid-template-columns:1fr 1fr}
  .choix input{position:absolute;opacity:0;width:1px;height:1px;min-height:0;margin:0}
  .choix label{margin:0}
  .choix span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:52px;border-radius:8px;border:3px solid transparent;font-weight:800;font-size:.95rem;padding:4px;opacity:.55}
  .choix input:checked + span{opacity:1;border-color:var(--noir);box-shadow:0 0 0 2px var(--chaux) inset}
  .choix input:focus-visible + span{outline:3px solid var(--bleu);outline-offset:2px}
  .s-mvola{background:var(--vert);color:#fff} .s-orange{background:var(--noir);color:var(--orange)} .s-airtel{background:var(--rouge);color:#fff}
  .s-neutre{background:#fff;border-color:#CFC6AC!important;color:var(--noir)}
  .calcul{background:#fff;border:2px dashed #CFC6AC;border-radius:8px;padding:10px 12px;margin-top:12px;font-size:.95rem}
  .calcul b{font-size:1.15rem}
  .calcul.erreur{border-color:var(--alerte);color:var(--alerte);font-weight:700}

  .toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--noir);color:var(--chaux);padding:12px 16px;border-radius:8px;font-weight:600;z-index:40;max-width:92vw;text-align:center}
  .toast.err{background:var(--alerte);color:#fff}
  .accueil{min-height:100vh}
  .accueil .enseigne{padding-top:calc(40px + env(safe-area-inset-top,0px))}
  .accueil .logo{font-size:2.8rem}
</style>
</head>
<body>

<header class="enseigne" id="entete">
  <div class="enseigne-ligne">
    <div>
      <h1 class="logo">CASH POINT</h1>
      <p class="qui" id="qui">MVola, Orange Money, Airtel Money</p>
    </div>
    <button class="btn-bord" id="btn-menu" type="button" hidden>Menu</button>
  </div>
  <div class="bande" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
</header>
<main id="vue"></main>

<div id="voile" class="voile" hidden><div class="feuille" role="dialog" aria-modal="true" id="feuille"></div></div>
<div id="toast" class="toast" hidden role="status"></div>
<input type="file" id="fichier" accept=".txt,.json,text/plain,application/json,*/*" hidden>

<script>
"use strict";
/* ================= Constantes ================= */
const VERSION = 2;
const STOCK = "cashpoint_v2";
// Clé de signature des fichiers : empêche de modifier un rapport sans que le patron le voie.
const CLE_SIGNATURE = "cP-mG-2026-Rk7#vQ9!tZ3@wL5$hN8";
const OPERATEURS = { mvola: "MVola", orange: "Orange Money", airtel: "Airtel Money" };
const COMPTES = { especes: "Espèces", mvola: "MVola", orange: "Orange Money", airtel: "Airtel Money" };
const CLES = ["especes", "mvola", "orange", "airtel"];
const TYPES = { depot: "Dépôt", transfert: "Envoi", retrait: "Retrait", echange: "Échange", mouvement: "Entrée / sortie", ajustement: "Correction des soldes" };

const TARIFS_DEFAUT = [
  [1001,5000,0,140,500],[5001,10000,0,275,1000],[10001,20000,0,550,1500],
  [20001,30000,0,1300,3000],[30001,40000,0,1300,4000],[40001,50000,0,1300,4200],
  [50001,60000,0,1900,5000],[60001,70000,0,1900,5200],[70001,80000,0,1900,5400],
  [80001,90000,0,1900,5600],[90001,100000,0,1900,7000],[100001,200000,0,3400,10000],
  [200001,300000,0,4700,15000],[300001,400000,0,4700,17000],[400001,500000,0,4700,19000],
  [500001,600000,0,8800,29000],[600001,700000,0,8800,31000],[700001,800000,0,8800,33000],
  [800001,900000,0,8800,35000],[900001,1000000,0,8800,37000],[1000001,2000000,0,14700,55000],
  [2000001,3000000,0,19600,85000],[3000001,4000000,0,24500,105000],[4000001,5000000,0,29400,145000],
  [5000001,6000000,0,34300,175000],[6000001,7000000,0,39200,195000],[7000001,8000000,0,44100,235000],
  [8000001,9000000,0,49000,265000],[9000001,10000000,0,53900,295000]
].map(([min,max,depot,transfert,retrait]) => ({ min, max, depot, transfert, retrait }));

/* ================= SHA-256 / HMAC (sans internet, sans dépendance) ================= */
const K256 = new Uint32Array([
0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256(bytes) {
  const l = bytes.length, n = (((l + 9) + 63) >> 6) << 6;
  const m = new Uint8Array(n); m.set(bytes); m[l] = 0x80;
  const dv = new DataView(m.buffer);
  dv.setUint32(n - 4, (l * 8) >>> 0); dv.setUint32(n - 8, Math.floor(l / 0x20000000));
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const w = new Uint32Array(64);
  const r = (x, k) => (x >>> k) | (x << (32 - k));
  for (let i = 0; i < n; i += 64) {
    for (let t = 0; t < 16; t++) w[t] = dv.getUint32(i + t * 4);
    for (let t = 16; t < 64; t++) {
      const s0 = r(w[t-15],7) ^ r(w[t-15],18) ^ (w[t-15] >>> 3);
      const s1 = r(w[t-2],17) ^ r(w[t-2],19) ^ (w[t-2] >>> 10);
      w[t] = (w[t-16] + s0 + w[t-7] + s1) | 0;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for (let t = 0; t < 64; t++) {
      const t1 = (h + (r(e,6) ^ r(e,11) ^ r(e,25)) + ((e & f) ^ (~e & g)) + K256[t] + w[t]) | 0;
      const t2 = ((r(a,2) ^ r(a,13) ^ r(a,22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0; H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }
  const out = new Uint8Array(32); const ov = new DataView(out.buffer);
  H.forEach((v, i) => ov.setUint32(i * 4, v >>> 0));
  return out;
}
const utf8 = (s) => new TextEncoder().encode(s);
const hex = (b) => Array.from(b, (x) => x.toString(16).padStart(2, "0")).join("");
function hmac(texte) {
  let k = utf8(CLE_SIGNATURE); if (k.length > 64) k = sha256(k);
  const kp = new Uint8Array(64); kp.set(k);
  const ip = kp.map((x) => x ^ 0x36), op = kp.map((x) => x ^ 0x5c);
  const msg = utf8(texte);
  const a = new Uint8Array(64 + msg.length); a.set(ip); a.set(msg, 64);
  const ih = sha256(a);
  const b = new Uint8Array(96); b.set(op); b.set(ih, 64);
  return hex(sha256(b));
}
const empreinte = (texte) => hex(sha256(utf8(texte)));

/* ================= Stockage local ================= */
let D = null;
function charger() {
  try { const t = localStorage.getItem(STOCK); return t ? JSON.parse(t) : null; }
  catch (e) { return null; }
}
function sauver() {
  try { localStorage.setItem(STOCK, JSON.stringify(D)); return true; }
  catch (e) { toast("Mémoire pleine : faites une sauvegarde puis effacez les anciens rapports (Réglages).", true); return false; }
}
D = charger();

/* ================= Outils ================= */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const nombre = (v) => { const n = parseInt(String(v ?? "").replace(/[^\d]/g, ""), 10); return isNaN(n) ? 0 : n; };
const fmt = (n) => { const v = Math.round(Number(n) || 0); return (v < 0 ? "-" : "") + Math.abs(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " Ar"; };
function jourDe(ms) { const x = ms ? new Date(ms) : new Date(); return x.getFullYear() + "-" + String(x.getMonth()+1).padStart(2,"0") + "-" + String(x.getDate()).padStart(2,"0"); }
const dateLisible = (j) => { const [a, m, d] = j.split("-"); return d + "/" + m + "/" + a; };
const heure = (ms) => new Date(ms).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
const dateHeure = (ms) => dateLisible(jourDe(ms)) + " à " + heure(ms);
const aleatoire = () => Array.from(crypto.getRandomValues(new Uint8Array(8)), (x) => x.toString(16).padStart(2, "0")).join("");
const hashCode = (code, sel) => empreinte(sel + ":" + code);
const zero = () => ({ especes: 0, mvola: 0, orange: 0, airtel: 0 });

let minuterie;
function toast(msg, err) {
  const t = $("#toast"); t.textContent = msg; t.className = "toast" + (err ? " err" : ""); t.hidden = false;
  clearTimeout(minuterie); minuterie = setTimeout(() => { t.hidden = true; }, err ? 6000 : 3000);
}
window.erreurAndroid = (m) => toast("Erreur : " + m, true);

function fraisPour(type, montant, tarifs) {
  if (!["depot", "transfert", "retrait"].includes(type)) return 0;
  const l = (tarifs || D.tarifs).find((t) => montant >= Number(t.min) && montant <= Number(t.max));
  return l ? (Number(l[type]) || 0) : null;
}
function effets(op) {
  const e = zero(), m = Number(op.montant) || 0, f = Number(op.frais) || 0;
  switch (op.type) {
    case "depot": case "transfert": e[op.operateur] -= m; e.especes += m + f; break;
    case "retrait": e[op.operateur] += m; e.especes += f - m; break;
    case "echange": e[op.de] -= m; e[op.vers] += m; break;
    case "mouvement": e[op.compte] += (op.sens === "entree" ? m : -m); break;
    case "ajustement": CLES.forEach((k) => { e[k] += Number(op.delta?.[k]) || 0; }); break;
  }
  return e;
}
function appliquer(depart, ops) {
  const s = {}; CLES.forEach((k) => { s[k] = Number(depart?.[k]) || 0; });
  ops.forEach((op) => { if (op.statut === "annulee") return; const e = effets(op); CLES.forEach((k) => { s[k] += e[k]; }); });
  return s;
}
const fraisTotal = (ops) => ops.filter((o) => o.statut !== "annulee").reduce((a, o) => a + (Number(o.frais) || 0), 0);
const rapportDe = (r) => JSON.parse(JSON.parse(r.fichier).donnees);
const valides = (ops) => ops.filter((o) => o.statut !== "annulee" && o.type !== "ajustement");

/* ================= Fichiers (envoi par Xender / Bluetooth / WhatsApp) ================= */
function emballer(objet) {
  const donnees = JSON.stringify(objet);
  return JSON.stringify({ app: "cashpoint", v: VERSION, donnees, sig: hmac(donnees) });
}
function deballer(texte) {
  let env;
  try { env = JSON.parse(texte); } catch (e) { throw new Error("Ce fichier n'est pas un fichier Cash Point."); }
  if (!env || env.app !== "cashpoint" || typeof env.donnees !== "string") throw new Error("Ce fichier n'est pas un fichier Cash Point.");
  if (hmac(env.donnees) !== env.sig) throw new Error("Fichier refusé : il a été modifié après sa création.");
  return { objet: JSON.parse(env.donnees), hash: empreinte(env.donnees) };
}
function partager(nom, contenu) {

  const a = document.createElement("a"); a.href = url; a.download = nom; document.body.appendChild(a); a.click(); a.remove();

}

/* ---- Clôture et rapport ---- */
function cloturer() {
  const s = soldesCaisse(), compte = {}, ecart = {}, theorique = {};
  for (const k of CLES) {
    if (!$("#k-" + k).value.trim()) return toast("Tapez le montant pour " + COMPTES[k] + " (0 si vide).", true);
    compte[k] = nombre($("#k-" + k).value); theorique[k] = Math.round(s[k]); ecart[k] = compte[k] - theorique[k];
  }
  const fin = Date.now();
  const rapport = {
    type: "rapport", v: VERSION, appareil: D.appareil, point: D.point, nomPoint: D.nomPoint, caissier: D.caissier,
    no: D.rapportNo + 1, precedent: D.dernierHash, debut: D.debut, fin, jour: jourDe(fin),
    seqDebut: D.seqDebut, seqFin: D.seq, ouverture: D.ouverture, ops: D.ops, theorique, compte, ecart,
    frais: fraisTotal(D.ops), remarque: $("#k-rq").value.trim()
  };
  const donnees = JSON.stringify(rapport);
  const fichier = JSON.stringify({ app: "cashpoint", v: VERSION, donnees, sig: hmac(donnees) });
  const ancien = { ouverture: D.ouverture, ops: D.ops, debut: D.debut, seqDebut: D.seqDebut, rapportNo: D.rapportNo, dernierHash: D.dernierHash, rapports: D.rapports };
  D.rapports = D.rapports.concat([{ fichier }]).slice(-40);
  D.rapportNo = rapport.no; D.dernierHash = empreinte(donnees);
  D.ouverture = compte; D.ops = []; D.debut = fin; D.seqDebut = D.seq + 1;
  if (!sauver()) { Object.assign(D, ancien); return; }
  fermer(); rendre();
  ouvrir(`${tete("Rapport prêt")}<p>Le rapport n°${rapport.no} est créé. Envoyez-le maintenant au patron.</p>
    <div class="chiffres"><span><b>${valides(rapport.ops).length}</b> opérations</span><span><b>${fmt(rapport.frais)}</b> de frais</span></div>
    <button class="principal" type="button" data-renvoyer="${rapport.no}">Envoyer au patron (Xender, Bluetooth…)</button>
    <p class="aide">Vous pourrez le renvoyer plus tard depuis Menu, puis Rapports de clôture.</p>`);
}
function nomFichierRapport(o) { return "CashPoint_Rapport_" + (o.point === "p1" ? "PV1" : "PV2") + "_" + o.jour + "_n" + o.no + ".txt"; }

}

function rapportsTries() { return D.rapports.map((r) => r.o).sort((a, b) => b.fin - a.fin); }
function ecartTotal(o) { return CLES.reduce((a, k) => a + (Number(o.ecart[k]) || 0), 0); }

function alertesRapport(o) {
  const al = [];
  const memes = D.rapports.map((r) => r.o).filter((x) => x.appareil === o.appareil);
  const prec = memes.find((x) => x.no === o.no - 1);
  if (o.no > 1 && !prec) al.push("Le rapport n°" + (o.no - 1) + " de ce téléphone n'a pas été reçu.");
  if (prec && prec.hashRecu !== o.precedent) al.push("Ce rapport ne suit pas le rapport n°" + prec.no + " reçu : le téléphone a peut-être été modifié.");
  if (prec && o.seqDebut !== prec.seqFin + 1) al.push("Des opérations manquent entre ce rapport et le précédent.");
  const seqs = o.ops.map((x) => x.seq).sort((a, b) => a - b);
  for (let s = o.seqDebut, i = 0; s <= o.seqFin; s++, i++) { if (seqs[i] !== s) { al.push("Des opérations ont disparu de ce rapport."); break; } }
  const autres = D.rapports.map((r) => r.o).filter((x) => x.point === o.point && x.appareil !== o.appareil && x.fin < o.fin);
  if (o.no === 1 && autres.length) al.push("Nouveau téléphone ou téléphone réinitialisé pour ce point de vente.");
  if (ecartTotal(o) < 0) al.push("Il manque " + fmt(-ecartTotal(o)) + " à la clôture.");
  const annulees = o.ops.filter((x) => x.statut === "annulee").length;
  if (annulees) al.push(annulees + " opération" + (annulees > 1 ? "s annulées" : " annulée") + " par le caissier.");
  if (o.ops.some((x) => x.type === "ajustement")) al.push("Les soldes ont été corrigés avec le code du patron.");
  return al;
}

function importerRapport(texte) {

/* ================= Soumissions de formulaires ================= */
document.addEventListener("submit", (ev) => {
  ev.preventDefault();
  const f = ev.target;
  if (f.id === "f-config") return enregistrerConfig(f);
  if (f.id === "f-verrou") {
    if (hashCode($("#v-code").value.trim(), D.sel) === D.codePatron) { DEVERROUILLE = true; rendre(); }
    else toast("Code incorrect.", true);
    return;
  }
  if (f.id === "f-op") {
    const type = f.dataset.type, op = (f.querySelector("input[name=f-operateur]:checked") || {}).value;
    const m = nombre($("#f-montant").value), frais = fraisPour(type, m);
    const reference = $("#f-ref").value.trim().toUpperCase(), tel = $("#f-tel").value.trim(), client = $("#f-nom").value.trim();
    if (!op) return toast("Choisissez l'opérateur.", true);
    if (!m) return toast("Tapez le montant.", true);
    if (frais === null) return toast("Montant hors grille des tarifs.", true);
    if (!reference) return toast("Tapez la référence de la transaction.", true);
    if (!tel) return toast("Tapez le numéro du client.", true);
    const deja = D.ops.concat(...D.rapports.slice(-10).map((r) => rapportDe(r).ops)).some((o) => o.reference === reference && o.operateur === op && o.statut !== "annulee");
    if (deja) return toast("Cette référence est déjà enregistrée.", true);
    const pb = type === "retrait" ? manque("especes", m - frais) : manque(op, m);
    if (pb) return toast(pb, true);
    const data = { type, operateur: op, montant: m, frais, reference, tel }; if (client) data.client = client;
    if (nouvelleOp(data)) toast(TYPES[type] + " enregistré.");
    return;
  }
  if (f.id === "f-echange") {
    const de = $("#e-de").value, vers = $("#e-vers").value, m = nombre($("#e-montant").value), motif = $("#e-motif").value.trim();
    if (de === vers) return toast("Choisissez deux comptes différents.", true);
    if (!m) return toast("Tapez le montant.", true);
    const pb = manque(de, m); if (pb) return toast(pb, true);
    const data = { type: "echange", de, vers, montant: m, frais: 0 }; if (motif) data.motif = motif;
    if (nouvelleOp(data)) toast("Échange enregistré.");
    return;
  }
  if (f.id === "f-mouv") {
    const sens = (f.querySelector("input[name=m-sens]:checked") || {}).value, compte = $("#m-compte").value, m = nombre($("#m-montant").value), motif = $("#m-motif").value.trim();
    if (!sens) return toast("Choisissez entrée ou sortie.", true);
    if (!m) return toast("Tapez le montant.", true);
    if (!motif) return toast("Tapez le motif.", true);
    if (sens === "sortie") { const pb = manque(compte, m); if (pb) return toast(pb, true); }
    if (nouvelleOp({ type: "mouvement", sens, compte, montant: m, frais: 0, motif })) toast((sens === "entree" ? "Entrée" : "Sortie") + " enregistrée.");
    return;
  }
  if (f.id === "f-annul") {
    const motif = $("#a-motif").value.trim(); if (!motif) return toast("Tapez le motif.", true);
    const op = D.ops.find((o) => o.seq === Number(f.dataset.seq)); if (!op) return;
    op.statut = "annulee"; op.motifAnnulation = motif; op.annuleLe = Date.now();
    if (sauver()) { fermer(); rendre(); toast("Opération annulée. Le patron le verra dans le rapport."); }
    return;
  }
  if (f.id === "f-cloture") return cloturer();
  if (f.id === "f-fixer") {
    const s = soldesCaisse(), delta = {};
    CLES.forEach((k) => { delta[k] = nombre($("#x-" + k).value) - Math.round(s[k]); });
    if (nouvelleOp({ type: "ajustement", delta, montant: 0, frais: 0 })) toast("Soldes corrigés.");
    return;
  }
  if (f.id === "f-nom-caissier") {
    const n = $("#n-caissier").value.trim(); if (!n) return toast("Tapez un nom.", true);
    D.caissier = n; if (sauver()) { fermer(); rendre(); toast("Nom enregistré."); }
    return;
  }
  if (f.id === "f-nouveau-code") {
    const c = $("#nc-1").value.trim();
    if (c.length < 4) return toast("Le code doit avoir au moins 4 caractères.", true);
    if (c !== $("#nc-2").value.trim()) return toast("Les deux codes ne sont pas identiques.", true);
    D.codePatron = hashCode(c, D.sel); if (sauver()) { fermer(); toast("Code changé."); }
    return;
  }
});

document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("button"); if (!b) return;

  if ("fermer" in d) return fermer();
  if (d.config) return formConfig(d.config);
  if (b.id === "btn-menu") {
    if (D.role === "caisse") return menuCaisse();
    ONGLET = "reglages"; ECRAN = "principal"; return rendre();
  }
  if ("retour" in d) { ECRAN = "principal"; RAPPORT_OUVERT = null; return rendre(); }
  if (d.form) {
    if (["depot", "transfert", "retrait"].includes(d.form)) return formOperateur(d.form);

    if (d.form === "mouvement") return formMouvement();
    if (d.form === "cloture") return formCloture();

  }

  if ("fixer" in d) return formFixer();
  if ("tarifsCaisse" in d) {

  if ("nomCaissier" in d) {

  }
  if ("reset" in d) {
    fermer();
    if (!(await demanderCodePatron("Code du patron pour réinitialiser"))) return;
    if (!(await demander("Toutes les données de ce téléphone seront effacées. Envoyez d'abord les rapports au patron. Continuer ?", "Tout effacer"))) return;
    try { localStorage.removeItem(STOCK); } catch (e) {}
    D = null; DEVERROUILLE = false; ECRAN = "principal"; return rendre();
  }
  if (d.onglet) { ONGLET = d.onglet; ECRAN = "principal"; return rendre(); }
  if ("importer" in d) return choisirFichier(importerRapport);
  if (d.rapport) {
    const [app, no] = d.rapport.split(":");
    RAPPORT_OUVERT = D.rapports.map((r) => r.o).find((o) => o.appareil === app && o.no === Number(no));
    ECRAN = "rapport"; return rendre();
  }
  if (b.id === "t-ajouter") { $("#t-corps").insertAdjacentHTML("beforeend", ligneTarif({ min: 0, max: 0, depot: 0, transfert: 0, retrait: 0 })); return; }
  if ("supprLigne" in d) { b.closest("tr").remove(); return; }

    const l = lireTarifs(); if (!l) return;
    D.tarifs = l; D.tarifsDate = Date.now();

    return;
  }
  if ("envoyerTarifs" in d) {

    if (sauver()) toast("Noms enregistrés."); return;
  }

    return partager("CashPoint_Sauvegarde_" + jourDe() + ".txt", emballer({ type: "sauvegarde", v: VERSION, rapports: D.rapports.map((r) => r.o), noms: D.noms, tarifs: D.tarifs, date: Date.now() }));
  }

    return choisirFichier((t) => {

      o.rapports.forEach((r) => { if (!D.rapports.some((x) => x.o.appareil === r.appareil && x.o.no === r.no)) { D.rapports.push({ o: r }); ajout++; } });
      if (sauver()) { rendre(); toast(ajout + " rapport(s) restauré(s)."); }

    if (!(await demanderCodePatron("Code actuel du patron"))) return;
    return ouvrir(`${tete("Nouveau code")}<form id="f-nouveau-code" novalidate>
      <label for="nc-1">Nouveau code<input id="nc-1" type="password" inputmode="numeric" autocomplete="off"></label>
      <label for="nc-2">Retaper le nouveau code<input id="nc-2" type="password" inputmode="numeric" autocomplete="off"></label>
      <button class="principal" type="submit">Enregistrer</button></form>`);
  }
  if ("nettoyer" in d) {
    const limite = Date.now() - 92 * 24 * 3600 * 1000, vieux = D.rapports.filter((r) => r.o.fin < limite).length;
    if (!vieux) return toast("Aucun rapport de plus de 3 mois.");
    if (!(await demander(vieux + " rapport(s) de plus de 3 mois seront effacés. Faites d'abord une sauvegarde. Continuer ?", "Effacer"))) return;
    D.rapports = D.rapports.filter((r) => r.o.fin >= limite);
    if (sauver()) { rendre(); toast("Anciens rapports effacés."); }
    return;
  }
  if ("verrouiller" in d) { DEVERROUILLE = false; ECRAN = "principal"; return rendre(); }
});
document.addEventListener("change", (ev) => { if (ev.target.name === "f-operateur") majCalcul(); });

rendre();
</script>
