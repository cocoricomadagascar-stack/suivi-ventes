apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.suivi.ventes'
    compileSdk 34

    defaultConfig {
        applicationId "com.suivi.ventes"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    // Clé fixe : chaque nouvelle APK peut être installée par-dessus l'ancienne sans effacer les données.
    signingConfigs {
        cashpoint {
            storeFile file("cashpoint.keystore")
            storePassword "cashpoint2026"
            keyAlias "cashpoint"
            keyPassword "cashpoint2026"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.cashpoint
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.cashpoint
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
}
